# UniFi HQ fork release 0.2.0. Four services plus the upstream GeoIP job.
# On Unraid use scripts/unraid.py; Docker Compose is an optional alternative.
name: unifi-hq

x-hardening: &hardening
  network_mode: host
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "2"

services:
  geoip:
    <<: *hardening
    image: alpine:3.24
    container_name: unifi-hq-geoip
    restart: "no"
    command: ["/bin/sh", "/update.sh"]
    environment:
      GEOIP_MAX_AGE_DAYS: ${GEOIP_MAX_AGE_DAYS:-32}
    volumes:
      - ./scripts/geoip-update.sh:/update.sh:ro
      - ${HQ_DATA_DIR:-./data}/geoip:/geoip
    mem_limit: 128m

  victorialogs:
    <<: *hardening
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: unifi-hq-history
    command:
      - -httpListenAddr=127.0.0.1:${HISTORY_PORT:-9428}
      - -storageDataPath=/vlogs
      - -retentionPeriod=${RETENTION:-30d}
      - -retention.maxDiskSpaceUsageBytes=${MAX_DISK:-20GiB}
      - -inmemoryDataFlushInterval=30s
      - -loggerLevel=WARN
      - -search.maxQueryDuration=60s
    volumes:
      - ${HQ_DATA_DIR:-./data}/history:/vlogs
    mem_limit: 512m
    labels:
      net.unraid.docker.managed: dockerman

  collector:
    <<: *hardening
    build: ./collector
    image: ${HQ_IMAGE_PREFIX:-ghcr.io/mephistojb/unifi-hq}-collector:${HQ_VERSION:-0.2.0}
    container_name: unifi-hq-collector
    environment:
      TZ: ${TZ:-Europe/Berlin}
      VECTOR_LOG: ${VECTOR_LOG:-warn}
      VECTOR_THREADS: ${VECTOR_THREADS:-1}
      WAN_IP: ${WAN_IP:-}
      ALLOWED_SENDERS: ${ALLOWED_SENDERS:-127.0.0.1}
      LOCAL_EXTRA_NETS: ${LOCAL_EXTRA_NETS:-}
      LOCAL_SERVER_PORTS: ${LOCAL_SERVER_PORTS:-51820}
      IGNORE_IPS: ${IGNORE_IPS:-}
      IPFIX_PORT: ${IPFIX_PORT:-2055}
      SYSLOG_PORT: ${SYSLOG_PORT:-5514}
      LIVE_PORT: ${LIVE_PORT:-8090}
      METRICS_PORT: ${METRICS_PORT:-8091}
      HISTORY_PORT: ${HISTORY_PORT:-9428}
    volumes:
      - ${HQ_DATA_DIR:-./data}/config:/etc/vector/config:ro
      - ${HQ_DATA_DIR:-./data}/geoip:/geoip:ro
    tmpfs:
      - /var/lib/vector:uid=65534,gid=65534,size=16m
    depends_on:
      geoip:
        condition: service_completed_successfully
      victorialogs:
        condition: service_started
    mem_limit: 384m
    labels:
      net.unraid.docker.managed: dockerman

  api:
    <<: *hardening
    build: ./api
    image: ${HQ_IMAGE_PREFIX:-ghcr.io/mephistojb/unifi-hq}-api:${HQ_VERSION:-0.2.0}
    container_name: unifi-hq-api
    user: "0:0"
    cap_add: [KILL]
    # Recreate API after recreating collector: a restart retains its old PID target.
    pid: "service:collector"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HOSTS_FILE: /config/hosts.csv
      LISTEN: 127.0.0.1:${API_PORT:-8092}
      AUTH_PASSWORD_HASH_FILE: /run/secrets/auth_password_hash
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_SITE_ID: ${UNIFI_SITE_ID:-}
      UNIFI_API_BASE_PATH: ${UNIFI_API_BASE_PATH:-/proxy/network/integration/v1}
      UNIFI_API_KEY_FILE: /run/secrets/unifi_api_key
      UNIFI_CA_FILE: ${UNIFI_CA_FILE:-}
      UNIFI_POLL_SECONDS: ${UNIFI_POLL_SECONDS:-15}
      UNIFI_STALE_SECONDS: ${UNIFI_STALE_SECONDS:-60}
      INVENTORY_FILE: /state/inventory.json
    volumes:
      - ${HQ_DATA_DIR:-./data}/config:/config
      - ${HQ_DATA_DIR:-./data}/state:/state
      - ${HQ_SECRETS_DIR:-./data/secrets}:/run/secrets:ro
    depends_on: [collector]
    mem_limit: 128m
    labels:
      net.unraid.docker.managed: dockerman

  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: caddy/Dockerfile
    image: ${HQ_IMAGE_PREFIX:-ghcr.io/mephistojb/unifi-hq}-web:${HQ_VERSION:-0.2.0}
    container_name: unifi-hq-web
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      API_PORT: ${API_PORT:-8092}
      LIVE_PORT: ${LIVE_PORT:-8090}
      HISTORY_PORT: ${HISTORY_PORT:-9428}
      ALLOWED_CLIENTS: ${ALLOWED_CLIENTS:-private_ranges}
      HOME_LAT: ${HOME_LAT:-50.11}
      HOME_LON: ${HOME_LON:-8.68}
      HOME_LABEL: ${HOME_LABEL:-Home}
      GATEWAY_NAME: ${GATEWAY_NAME:-Gateway}
    tmpfs:
      - /data:size=1m
      - /config:size=1m
    depends_on: [collector, victorialogs, api]
    mem_limit: 64m
    labels:
      net.unraid.docker.managed: dockerman
      net.unraid.docker.webui: http://[IP]:${HTTP_PORT:-8080}/
